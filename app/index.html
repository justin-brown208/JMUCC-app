<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the gradient run under the notch; index.css
         pays it back with safe-area insets so content isn't clipped.
         maximum-scale + user-scalable=no stop pinch/double-tap zoom so this
         reads as an app, not a web page. Android honours them; iOS Safari has
         ignored user-scalable since iOS 10, so index.css also sets
         touch-action to cover it there. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="theme-color" content="#213957" />
    <meta name="description" content="JMUCC case competition companion app." />
    <!-- iOS ignores manifest icons for the home screen and uses this instead. -->
    <link rel="apple-touch-icon" href="/icons/icon-192x192.png" />
    <link rel="icon" type="image/png" href="/icons/icon-192x192.png" />
    <title>JMUCC</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
